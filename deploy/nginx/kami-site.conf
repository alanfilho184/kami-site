# Kami - site
# Nginx da VPS. O TLS termina aqui; a Cloudflare fala com esta origem em
# Full (strict). A aplicação escuta apenas em 127.0.0.1:3000.

upstream kami_site {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name kamiapp.com.br www.kamiapp.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kamiapp.com.br www.kamiapp.com.br;

    # Certificado de origem da Cloudflare, ou Let's Encrypt se o proxy estiver
    # desligado durante a implantação inicial.
    ssl_certificate /etc/ssl/kami/origin.pem;
    ssl_certificate_key /etc/ssl/kami/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security 'max-age=15552000; includeSubDomains' always;

    # Socket.IO da D5. O mesmo bloco já funciona para o HTTP enquanto isso.
    location /socket.io/ {
        proxy_pass http://kami_site;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location / {
        proxy_pass http://kami_site;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Arquivos internos e de configuração nunca são servidos.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
